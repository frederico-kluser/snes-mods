# =============================================================================
# Release Please — snes-mods (frederico-kluser/snes-mods)
#
# Mantém um PR de release com a próxima versão (calculada pelos Conventional Commits) e o
# CHANGELOG.md; ao fazer o squash merge desse PR, cria a tag vX.Y.Z e a GitHub Release.
# Atualiza também `__version__` em snesfab/__init__.py (marcador x-release-please-version).
#
# PRs abertos com o GITHUB_TOKEN não disparam `pull_request` em outros workflows; por isso o
# job dispara o CI (workflow_dispatch, a exceção documentada) na branch do PR de release, para
# o status check obrigatório `build` existir. Requer "Allow GitHub Actions to create and approve
# pull requests" ligado no repositório. Não há publicação em registry (nada a publicar).
# Actions fixadas por SHA.
# =============================================================================

name: Release Please

on:
  push:
    branches:
      - "main"

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # tags, releases e commits no PR de release
      pull-requests: write   # abrir/atualizar o PR de release
      actions: write         # disparar o CI no PR de release
    steps:
      - name: Release Please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: CI no PR de release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          branch="release-please--branches--main"
          if gh api "repos/$REPO/branches/$branch" --silent 2>/dev/null; then
            gh workflow run ci.yml --repo "$REPO" --ref "$branch"
            echo "CI disparado em $branch"
          else
            echo "sem PR de release aberto"
          fi
