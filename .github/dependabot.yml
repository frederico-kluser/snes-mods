# Atualizações automáticas (semanais) — mensagens em Conventional Commits para passar no job `build`.
# O toolchain pinado em tools/manifest.json (Ghidra, MesenCE, Asar, ffmpeg, JDK) é atualizado à mão,
# com novo sha256, num PR próprio.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: "npm"            # rea-agents (servidor MCP do REA)
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions:
        patterns: ["*"]
