# Lint do snesfab (CI: job "Lint"). Regras escolhidas explicitamente (o conjunto padrão muda
# entre versões do ruff); linhas até 120 colunas.
line-length = 120
target-version = "py312"
extend-exclude = ["tools", "node_modules", ".venv", "runs", "work", "build", ".agents/snes-mods-coala-agent-skill"]

[lint]
select = ["E4", "E7", "E9", "F"]
